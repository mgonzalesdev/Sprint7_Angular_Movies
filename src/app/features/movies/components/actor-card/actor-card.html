

<div class="flex flex-col h-full bg-neutral-primary-soft border border-default rounded-base shadow-xs overflow-hidden group hover:border-blue-500 transition-colors">
    <!-- Contenedor de Imagen (Relación de aspecto vertical de cine) -->
    <div class="aspect-[2/3] overflow-hidden bg-neutral-secondary-soft">
        <img 
            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
            [src]="actor()?.imgProfile" 
            [alt]="actor()?.name" 
        />
    </div>

    <!-- Información del Actor -->
    <div class="p-2 flex flex-col justify-center flex-grow text-center">
        <h5 class="text-[11px] md:text-xs font-bold tracking-tight text-heading leading-tight truncate" [title]="actor()?.name">
            {{actor()?.name}}
        </h5>
        <p class="text-[10px] text-gray-400 truncate mt-0.5" [title]="actor()?.character">
            {{actor()?.character}}
        </p>
    </div>
</div>
