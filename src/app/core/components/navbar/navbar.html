@if (showNavbar()) {
<nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
            <img src="./logo_movie.png" class="h-7" alt="Logo" />
            <span class="self-center text-xl text-heading font-semibold whitespace-nowrap">Angular Movies</span>
        </a>
        <button data-collapse-toggle="navbar-default" type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary">
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>
        <div class="hidden w-full md:block md:w-auto" id="navbar-default">
            <ul
                class="font-medium flex flex-col items-center p-4 md:p-0 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0 md:border-0 md:bg-neutral-primary">

                <li>
                    <a routerLink="/" routerLinkActive="text-blue-700 md:text-blue-500"
                        [routerLinkActiveOptions]="{exact: true}"
                        class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:p-0">
                        Inicio
                    </a>
                </li>
                @if (authService.currentUser()) {
                <li>
                    <a routerLink="/movies" routerLinkActive="text-blue-700 md:text-blue-500"
                        class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:p-0">
                        Peliculas
                    </a>
                </li>
                <li class="relative group py-2 md:py-0">
                    <!-- Circulo con Inicial -->
                    <div
                        class="w-9 h-9 flex items-center justify-center bg-blue-600 text-white rounded-full cursor-pointer ring-2 ring-neutral-tertiary">
                        <span class="text-sm font-bold">{{ userInitial() }}</span>
                    </div>

                    <!-- Tooltip (Aparece al hacer hover) -->
                    <div role="tooltip"
                        class="absolute z-30 invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-opacity duration-300 inline-block px-3 py-2 text-xs font-medium text-white bg-gray-900 rounded-lg shadow-sm -left-16 top-11 whitespace-nowrap dark:bg-gray-700">
                        {{ authService.currentUser()?.email }}
                        <div
                            class="absolute -top-1 left-1/2 -translate-x-1/2 border-l-4 border-r-4 border-b-4 border-transparent border-b-gray-900 dark:border-b-gray-700">
                        </div>
                    </div>

                </li>
                <button (click)="logout()">Salir</button>
                } @else {
                <li>
                    <a routerLink="/login" routerLinkActive="text-blue-700 md:text-blue-500"
                        class="block py-2 px-3 text-heading rounded hover:bg-neutral-tertiary md:hover:bg-transparent md:p-0">
                        Login
                    </a>
                </li>
                }
            </ul>
        </div>
    </div>
</nav>
}
